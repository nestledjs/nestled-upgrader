      - pnpm test
  - name: moceanic-ai
    path: ../moceanic-ai
    defaultBranch: develop
    forkedAreas: []
    verification:
      - pnpm lint
      - pnpm test
  - name: muzebook
    path: ../muzebook
    defaultBranch: develop
    forkedAreas: []
    verification:
      - pnpm lint
      - pnpm test
  - name: qalatra.com
    path: ../qalatra.com
    defaultBranch: develop
    forkedAreas: []
    verification:
      - pnpm lint
      - pnpm test
  - name: travel-outlook
    path: ../travel-outlook
